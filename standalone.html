// Main syllabus parser
/**
 * Parse syllabus text into event candidates
 * @param {string} text - The syllabus text to parse
 * @param {Object} options - Parsing options
 * @param {Object} options.term - Term settings { start_date, end_date, timezone }
 * @param {Object} options.course - Course info { id, meetings }
 * @returns {Object} { candidates: [], warnings: [] }
 */
function parseSyllabus(text, { term, course }) {
    const candidates = [];
    const warnings = [];
    
    console.log('[Parser] parseSyllabus called', {
        textLength: text?.length || 0,
        term: term ? { start_date: term.start_date, end_date: term.end_date, timezone: term.timezone } : null,
        courseId: course?.id
    });
    
    if (!text || typeof text !== 'string') {
        console.warn('[Parser] No text provided');
        return { candidates: [], warnings: ['No text provided'] };
    }
    
    // Normalize text
    const normalized = normalizeText(text);
    console.log('[Parser] Normalized text length:', normalized.length);
    
    // Split into lines
    const lines = splitIntoLines(normalized);
    console.log('[Parser] Split into', lines.length, 'lines');
    
    if (lines.length === 0) {
        console.warn('[Parser] No content found after splitting');
        return { candidates: [], warnings: ['No content found'] };
    }
    
    // Parse term dates
    const termStart = term?.start_date ? new Date(term.start_date) : null;
    const termEnd = term?.end_date ? new Date(term.end_date) : null;
    const timezone = term?.timezone || 'America/Chicago';
    
    if (!termStart || !termEnd) {
        warnings.push('Term dates not set - dates may be inaccurate');
        console.warn('[Parser] Term dates not set');
    } else {
        console.log('[Parser] Term range:', termStart.toISOString().split('T')[0], 'to', termEnd.toISOString().split('T')[0]);
    }
    
    // Get course meetings for time inference
    const courseMeetings = course?.meetings?.filter(m => m.start_time) || [];
    console.log('[Parser] Course meetings for time inference:', courseMeetings.length);
    
    // Context tracking
    let currentAnchorDate = null;
    let currentCarryForwardDate = null;
    
    // Process each line with all strategies
    lines.forEach((line, lineIndex) => {
        // Check for week anchor: "Week X – <date>"
        const weekMatch = line.match(/(?:week|周)\s*(\d+)[:–-：]\s*([^\n]+)/i);
        if (weekMatch && termStart) {
            // Try to parse date from anchor
            const dateStr = weekMatch[2].trim();
            const anchorDateResult = extractDateFromAnchor(dateStr, termStart, termEnd);
            if (anchorDateResult) {
                // extractDate can return Date or { start, end, isRange }
                if (anchorDateResult instanceof Date) {
                    currentAnchorDate = anchorDateResult;
                    currentCarryForwardDate = anchorDateResult;
                    console.log('[Parser] Week anchor found:', weekMatch[1], 'date:', anchorDateResult);
                } else if (anchorDateResult.start && !anchorDateResult.isRange) {
                    currentAnchorDate = anchorDateResult.start;
                    currentCarryForwardDate = anchorDateResult.start;
                    console.log('[Parser] Week anchor found:', weekMatch[1], 'date:', anchorDateResult.start);
                }
            }
        }
        
        // Try each strategy
        const strategies = [
            { name: 'Due', fn: () => parseDueStrategy(line, { termStart, termEnd, courseMeetings }) },
            { name: 'ExamQuiz', fn: () => parseExamQuizStrategy(line, { termStart, termEnd, courseMeetings }) },
            { name: 'RangeBreak', fn: () => parseRangeBreakStrategy(line, { termStart, termEnd }) },
            { name: 'ChapterWeek', fn: () => parseChapterWeekStrategy(line, { termStart, termEnd }) }
        ];
        
        for (const strategy of strategies) {
            try {
                const results = strategy.fn();
                if (results && results.length > 0) {
                    console.log(`[Parser] Strategy "${strategy.name}" matched line ${lineIndex + 1}:`, line.substring(0, 100));
                    console.log(`[Parser] Extracted ${results.length} candidate(s):`, results.map(r => ({
                        type: r.type,
                        title: r.title?.substring(0, 50),
                        start_datetime: r.start_datetime,
                        timeExtracted: r.start_datetime?.includes('T') ? r.start_datetime.split('T')[1] : 'none',
                        confidence: r.confidence,
                        reasoning: r.reasoning
                    })));
                    
                    // Apply context if candidate has no date
                    results.forEach(candidate => {
                        if (!candidate.start_datetime) {
                            let dateToUse = null;
                            // currentAnchorDate and currentCarryForwardDate are Date objects or null
                            if (currentAnchorDate instanceof Date) {
                                dateToUse = currentAnchorDate;
                            } else if (currentCarryForwardDate instanceof Date) {
                                dateToUse = currentCarryForwardDate;
                            }
                            
                            if (dateToUse) {
                                const year = dateToUse.getFullYear();
                                const month = String(dateToUse.getMonth() + 1).padStart(2, '0');
                                const day = String(dateToUse.getDate()).padStart(2, '0');
                                const dateStr = `${year}-${month}-${day}`;
                                
                                // Default time based on type
                                let defaultTime = { hh: '23', mm: '59' };
                                if (candidate.type === 'EXAM' || candidate.type === 'QUIZ') {
                                    defaultTime = { hh: '12', mm: '00' };
                                }
                                
                                candidate.start_datetime = `${dateStr}T${defaultTime.hh}:${defaultTime.mm}`;
                                candidate.end_datetime = candidate.start_datetime;
                                candidate.confidence = Math.max(0.3, candidate.confidence - 0.2);
                                candidate.needs_review = true;
                                console.log(`[Parser] Applied anchor date to candidate:`, candidate.start_datetime);
                            }
                        } else {
                            // Log date/time extraction decision
                            const datePart = candidate.start_datetime.split('T')[0];
                            const timePart = candidate.start_datetime.split('T')[1];
                            console.log(`[Parser] Candidate has explicit date/time:`, {
                                date: datePart,
                                time: timePart,
                                all_day: candidate.all_day,
                                type: candidate.type
                            });
                        }
                        
                        // Add course_id and term_id
                        candidate.course_id = course?.id || null;
                        candidate.term_id = 'current';
                        
                        // Generate dedupe key
                        candidate.dedupe_key = generateDedupeKey(
                            'current',
                            candidate.course_id,
                            candidate.type,
                            candidate.start_datetime,
                            candidate.title
                        );
                        
                        // Determine if topic
                        candidate.is_topic = !candidate.start_datetime && !currentAnchorDate && !currentCarryForwardDate;
                        
                        candidates.push(candidate);
                    });
                    break; // Only use first matching strategy
                }
            } catch (error) {
                console.warn(`[Parser] Strategy "${strategy.name}" error on line ${lineIndex + 1}:`, error);
            }
        }
    });
    
    console.log('[Parser] Total candidates before scoring:', candidates.length);
    
    // Score all candidates
    const scoredCandidates = candidates.map(c => scoreCandidate(c, { termStart, termEnd }));
    
    // Deduplicate
    const uniqueCandidates = deduplicateCandidates(scoredCandidates);
    console.log('[Parser] After deduplication:', uniqueCandidates.length, 'candidates');
    
    // Sort chronologically
    const sortedCandidates = sortCandidates(uniqueCandidates);
    
    // Generate warnings
    const missingDates = sortedCandidates.filter(c => !c.start_datetime && !c.needs_review).length;
    const outsideRange = sortedCandidates.filter(c => c.needs_review && c.start_datetime).length;
    
    if (missingDates > 0) {
        warnings.push(`${missingDates} items missing dates`);
    }
    if (outsideRange > 0) {
        warnings.push(`${outsideRange} items outside term range`);
    }
    
    console.log('[Parser] Final result:', {
        candidates: sortedCandidates.length,
        warnings: warnings.length,
        withExplicitTime: sortedCandidates.filter(c => c.start_datetime && c.start_datetime.includes('T') && !c.all_day).length,
        allDay: sortedCandidates.filter(c => c.all_day).length
    });
    
    return {
        candidates: sortedCandidates,
        warnings: warnings
    };
}

// Helper: Extract date from week anchor
function extractDateFromAnchor(text, termStart, termEnd) {
    // Use the date parser to extract date from anchor text
    return extractDate(text, termStart, termEnd);
}

// Generate dedupe key
function generateDedupeKey(termId, courseId, type, dateStr, title) {
    const normalizedType = type || '';
    let normalizedDate = '';
    
    if (dateStr && typeof dateStr === 'string' && dateStr.includes('T')) {
        normalizedDate = dateStr.split('T')[0];
    }
    
    const normalizedTitle = (title || '').toLowerCase().trim().substring(0, 50);
    
    const str = `${termId}|${courseId}|${normalizedType}|${normalizedDate}|${normalizedTitle}`;
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return `dedupe_${Math.abs(hash).toString(36)}`;
}

// ========== services/icsExport.js ==========
// ICS Export service
/**
 * Export events to ICS format
 * @param {Object} state - Application state
 * @returns {string} ICS file content
 */
function exportICS(state) {
    const { events, courses, term } = state;
    
    if (!events || events.length === 0) {
        throw new Error('No events to export');
    }
    
    const timezone = term?.timezone || 'America/Chicago';
    
    const icsEvents = events.map(event => {
        // Parse floating local datetime (YYYY-MM-DDTHH:MM) as local time
        let startStr = event.start_datetime;
        let endStr = event.end_datetime || event.start_datetime;
        
        // Extract components from floating local datetime
        const startParts = startStr.split('T');
        const endParts = endStr.split('T');
        
        const startDate = startParts[0] || '';
        const startTime = startParts[1] || '00:00';
        const endDate = endParts[0] || startDate;
        const endTime = endParts[1] || startTime;
        
        const [startYear, startMonth, startDay] = startDate.split('-').map(Number);
        const [startHour, startMin] = startTime.split(':').map(Number);
        const [endYear, endMonth, endDay] = endDate.split('-').map(Number);
        const [endHour, endMin] = endTime.split(':').map(Number);
        
        // Create date array for ICS (treat as local time in timezone)
        const startArray = [startYear, startMonth, startDay, startHour || 0, startMin || 0];
        const endArray = [endYear, endMonth, endDay, endHour || 0, endMin || 0];
        
        let title = event.title;
        if (event.course_id && courses) {
            const course = courses.find(c => String(c.id) === String(event.course_id));
            if (course) {
                title = `[${course.course_name}] ${title}`;
            }
        }
        
        return {
            start: startArray,
            end: endArray,
            title: title,
            description: event.original_text_snippet || '',
            status: 'CONFIRMED',
            busyStatus: event.type === 'CLASS' ? 'BUSY' : 'FREE',
            categories: [event.type],
            timezone: timezone
        };
    });
    
    // Use ics library if available, otherwise generate manually
    let icsContent = '';
    
    if (typeof window !== 'undefined' && window.ics && window.ics.createEvents) {
        const { error, value } = window.ics.createEvents(icsEvents);
        
        if (error) {
            throw new Error(error.message || 'Failed to generate ICS');
        }
        icsContent = value;
        
        // If the library doesn't handle timezone, inject it manually
        if (!icsContent.includes('TZID') && timezone) {
            icsContent = icsContent.replace(
                /(BEGIN:VCALENDAR[\s\S]*?VERSION:2\.0)/,
                `$1\nTZID:${timezone}`
            );
            // Replace DTSTART/DTEND to include timezone
            icsContent = icsContent.replace(
                /DTSTART:(\d{8}T\d{6})/g,
                `DTSTART;TZID=${timezone}:$1`
            );
            icsContent = icsContent.replace(
                /DTEND:(\d{8}T\d{6})/g,
                `DTEND;TZID=${timezone}:$1`
            );
        }
    } else {
        // Fallback: Generate ICS manually with timezone support
        icsContent = 'BEGIN:VCALENDAR\n';
        icsContent += 'VERSION:2.0\n';
        icsContent += 'PRODID:-//Schedule Manager//EN\n';
        if (timezone) {
            icsContent += `TZID:${timezone}\n`;
        }
        
        icsEvents.forEach(event => {
            const startStr = formatICSDate(event.start);
            const endStr = formatICSDate(event.end);
            
            icsContent += 'BEGIN:VEVENT\n';
            if (timezone) {
                icsContent += `DTSTART;TZID=${timezone}:${startStr}\n`;
                icsContent += `DTEND;TZID=${timezone}:${endStr}\n`;
            } else {
                icsContent += `DTSTART:${startStr}\n`;
                icsContent += `DTEND:${endStr}\n`;
            }
            icsContent += `SUMMARY:${escapeICS(event.title)}\n`;
            if (event.description) {
                icsContent += `DESCRIPTION:${escapeICS(event.description)}\n`;
            }
            icsContent += `STATUS:${event.status}\n`;
            icsContent += 'END:VEVENT\n';
        });
        
        icsContent += 'END:VCALENDAR\n';
    }
    
    return icsContent;
}

/**
 * Download ICS file
 * @param {string} icsContent - ICS file content
 * @param {string} filename - Filename (default: 'course_schedule.ics')
 */
function downloadICS(icsContent, filename = 'course_schedule.ics') {
    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

            if (typeof Storage !== 'undefined') {

        // 这样当 _lang 改变时，Alpine 会重新评估所有使用 i18n.t() 的表达式
        get i18n() {

            if (typeof window !== 'undefined' && window.i18n && typeof window.i18n.translations) {

                const self = this; // 保存 this 引用
                return {
                    t: (key) => {
                        // 每次调用 t 时都读取最新的 _lang，确保响应式
                        // 注意：这里必须使用 self._lang 而不是 currentLang
                        const lang = self._lang;
                        if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                            return window.i18n.translations[lang][key] || key;
                        }
                        return key;
                    },
                    get lang() {

                    },
                    setLang: (lang) => {

                    }
                };

            if (typeof console !== 'undefined') {

                console.warn('[AlpineApp] window.i18n:', typeof window !== 'undefined' ? window.i18n : 'window undefined');
            }
            // Return a safe fallback object if i18n is not loaded yet
            const self = this;
            return {
                t: (key) => {
                    console.warn('[AlpineApp] ⚠️ i18n.t() called with key "' + key + '" but i18n not loaded');
                    return key; // Return key as fallback
                },
                get lang() {
                    return self._lang;
                },
                setLang: () => {}
            };
        },
        
        // lang getter/setter - 使用内部 _lang 属性，这样Alpine可以追踪变化
        get lang() {
            // 返回内部状态，Alpine可以追踪这个属性的变化
            return this._lang;
        },
        set lang(value) {

            if (typeof window !== 'undefined' && window.i18n) {
                window.i18n.setLang(value);

            Storage.set('events', this.events);
            Storage.set('term', this.term);

        // Computed properties
        get weekSchedule() {
            const now = new Date();
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() - now.getDay() + 1); // Monday
            
            const schedule = [];
            const dayMap = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6, 'Sun': 0 };
            const dayNames = this.lang === 'zh' ? ['周一', '周二', '周三', '周四', '周五', '周六', '周日'] : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            
            this.courses.forEach(course => {
                course.meetings?.forEach(meeting => {
                    if (meeting.isOnline && (!meeting.days_of_week || !meeting.start_time)) {
                        schedule.push({
                            id: `${course.id}-${meeting.id}-online`,
                            course_name: course.course_name,
                            section: course.section,
                            day: this.lang === 'zh' ? '在线课程' : 'Online',
                            dayIndex: 0,
                            time: this.lang === 'zh' ? '异步在线' : 'Asynchronous',
                            startTime: '00:00',
                            location: 'Online',
                            isOnline: true,
                            color: course.color || '#3B82F6'
                        });
                    } else if (meeting.days_of_week) {
                        const days = meeting.days_of_week.split(',').map(d => d.trim());
                        days.forEach(day => {
                            if (dayMap[day] !== undefined) {
                                schedule.push({
                                    id: `${course.id}-${meeting.id}-${day}`,
                                    course_name: course.course_name,
                                    section: course.section,
                                    day: dayNames[dayMap[day] - 1] || day,
                                    dayIndex: dayMap[day],
                                    time: meeting.start_time && meeting.end_time ? `${meeting.start_time} - ${meeting.end_time}` : '',
                                    startTime: meeting.start_time || '00:00',
                                    location: meeting.isOnline ? 'Online' : (meeting.location || ''),
                                    isOnline: meeting.isOnline || false,
                                    color: course.color || '#3B82F6'
                                });
                            }
                        });
                    }
                });
            });
            
            return schedule.sort((a, b) => {
                if (a.dayIndex !== b.dayIndex) {
                    return a.dayIndex - b.dayIndex;
                }
                return a.startTime.localeCompare(b.startTime);
            });
        },
        
        get todayEvents() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return this.events.filter(event => {
                let eventDate;
                if (typeof event.start_datetime === 'string' && event.start_datetime.includes('T') && !event.start_datetime.includes('Z')) {
                    const datePart = event.start_datetime.split('T')[0];
                    const [year, month, day] = datePart.split('-').map(Number);
                    eventDate = new Date(year, month - 1, day);
                } else {
                    eventDate = new Date(event.start_datetime);
                }
                eventDate.setHours(0, 0, 0, 0);
                return eventDate.getTime() === today.getTime() && event.type !== 'CLASS';
            });
        },
        
        get upcomingEvents() {
            const now = new Date();
            const twoWeeksLater = new Date(now);
            twoWeeksLater.setDate(twoWeeksLater.getDate() + 14);
            
            return this.allEvents
                .filter(event => {
                    let eventDate;
                    if (typeof event.start_datetime === 'string' && event.start_datetime.includes('T') && !event.start_datetime.includes('Z')) {
                        const datePart = event.start_datetime.split('T')[0];
                        const [year, month, day] = datePart.split('-').map(Number);
                        eventDate = new Date(year, month - 1, day);
                    } else {
                        eventDate = new Date(event.start_datetime);
                    }
                    const isOfficeHours = event.type === 'OTHER' && event.title && event.title.includes('Office Hours');
                    return eventDate > now && eventDate <= twoWeeksLater && event.type !== 'CLASS' && !isOfficeHours;
                })
                .sort((a, b) => {
                    const aDate = a.start_datetime;
                    const bDate = b.start_datetime;

        // Formatting methods
        formatDate(datetimeStr) {
            if (!datetimeStr) return '';
            if (typeof datetimeStr === 'string' && datetimeStr.includes('T') && !datetimeStr.includes('Z')) {
                const [year, month, day] = datetimeStr.split('T')[0].split('-').map(Number);
                const date = new Date(year, month - 1, day);
                const locale = this.lang === 'zh' ? 'zh-CN' : 'en-US';
                return formatDate(date, locale);
            }
            return formatDate(new Date(datetimeStr), this.lang === 'zh' ? 'zh-CN' : 'en-US');
        },
        
        formatTime(datetimeStr) {
            if (!datetimeStr || datetimeStr.length < 16) return '';
            return formatTime(datetimeStr, this.lang === 'zh' ? 'zh-CN' : 'en-US');
        },
        
        formatDateTime(datetimeStr) {
            if (!datetimeStr) return '';
            return formatDateTime(datetimeStr, this.lang === 'zh' ? 'zh-CN' : 'en-US');
        },

        generateClassEvents(course) {
            const startDate = new Date(this.term.start_date);
            const endDate = new Date(this.term.end_date);
            const dayMap = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6, 'Sun': 0 };
            
            course.meetings?.forEach(meeting => {
                if (!meeting.days_of_week || !meeting.start_time || !meeting.end_time) return;
                const days = meeting.days_of_week.split(',').map(d => d.trim());
                const [startHour, startMin] = meeting.start_time.split(':').map(Number);
                const [endHour, endMin] = meeting.end_time.split(':').map(Number);
                
                let currentDate = new Date(startDate);
                while (currentDate <= endDate) {
                    const dayOfWeek = currentDate.getDay();
                    const dayName = Object.keys(dayMap).find(k => dayMap[k] === dayOfWeek);
                    
                    if (dayName && days.includes(dayName)) {
                        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
                        const startDatetime = buildLocalDateTime(dateStr, { hh: String(startHour).padStart(2, '0'), mm: String(startMin).padStart(2, '0') });
                        const endDatetime = buildLocalDateTime(dateStr, { hh: String(endHour).padStart(2, '0'), mm: String(endMin).padStart(2, '0') });
                        
                        this.events.push({
                            id: `event-${Date.now()}-${Math.random()}`,
                            course_id: course.id,
                            title: `${course.course_name}${meeting.location ? ` (${meeting.location})` : ''}`,
                            type: 'CLASS',
                            start_datetime: startDatetime,
                            end_datetime: endDatetime,
                            all_day: false,
                            source: 'manual'
                        });
                    }
                    
                    currentDate.setDate(currentDate.getDate() + 1);
                }
            });
            
            Storage.set('events', this.events);
        },

            const endDate = new Date(this.term.end_date);

        // Candidate update methods
        updateCandidateDate(index, dateStr) {
            const candidate = this.parsedCandidates[index];
            if (!dateStr) {
                candidate.start_datetime = null;
                candidate.end_datetime = null;
                candidate.needs_review = true;
                return;
            }
            
            let dateISO = dateStr;
            if (dateStr instanceof Date) {
                const year = dateStr.getFullYear();
                const month = String(dateStr.getMonth() + 1).padStart(2, '0');
                const day = String(dateStr.getDate()).padStart(2, '0');
                dateISO = `${year}-${month}-${day}`;
            } else if (typeof dateStr === 'string' && dateStr.includes('T')) {
                dateISO = dateStr.split('T')[0];
            }
            
            if (candidate.start_datetime && candidate.start_datetime.includes('T')) {
                const existingTime = candidate.start_datetime.split('T')[1];
                candidate.start_datetime = `${dateISO}T${existingTime}`;
            } else {
                candidate.start_datetime = `${dateISO}T12:00`;
            }
            
            if (!candidate.end_datetime) {
                const startTime = candidate.start_datetime.split('T')[1];
                const [hours, minutes] = startTime.split(':').map(Number);
                let endHours = hours + 2;
                let endMinutes = minutes;
                if (endHours > 23) {
                    endHours = 23;
                    endMinutes = 59;
                }
                candidate.end_datetime = `${dateISO}T${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
            } else if (candidate.end_datetime.includes('T')) {
                const existingEndTime = candidate.end_datetime.split('T')[1];
                candidate.end_datetime = `${dateISO}T${existingEndTime}`;
            }
            
            candidate.needs_review = false;
        },
        
        updateCandidateTime(index, timeStr) {
            const candidate = this.parsedCandidates[index];
            if (!candidate.start_datetime) return;
            
            const datePart = candidate.start_datetime.split('T')[0] || candidate.start_datetime.substring(0, 10);
            
            if (!timeStr) {
                candidate.all_day = true;
                candidate.start_datetime = `${datePart}T00:00`;
                candidate.end_datetime = `${datePart}T23:59`;
                return;
            }
            
            const timeParts = timeStr.split(':');
            let hours = parseInt(timeParts[0]) || 0;
            let minutes = parseInt(timeParts[1]) || 0;
            
            hours = Math.max(0, Math.min(23, hours));
            minutes = Math.max(0, Math.min(59, minutes));
            
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            
            candidate.start_datetime = `${datePart}T${hh}:${mm}`;
            
            let endHours = hours + (candidate.type === 'EXAM' || candidate.type === 'QUIZ' ? 2 : 1);
            let endMinutes = minutes;
            if (endHours > 23) {
                endHours = 23;
                endMinutes = 59;
            }
            const endHh = String(endHours).padStart(2, '0');
            const endMm = String(endMinutes).padStart(2, '0');
            candidate.end_datetime = `${datePart}T${endHh}:${endMm}`;
            
            candidate.all_day = false;
            candidate.needs_review = false;
        },
        
        confirmSyllabusCandidates() {
            const selected = this.parsedCandidates.filter(c => c.selected);
            if (selected.length === 0) {

        getScheduleByDay(dayIndex) {
            const dayMap = { 0: 'Mon', 1: 'Tue', 2: 'Wed', 3: 'Thu', 4: 'Fri', 5: 'Sat', 6: 'Sun' };
            const targetDay = dayMap[dayIndex];
            
            const filtered = this.allSchedule.filter(item => {
                if (item.isOnline && (!item.days_of_week || item.days_of_week === 'Online')) {
                    return dayIndex === 0;
                }
                if (item.days_of_week && item.days_of_week !== 'Online') {
                    return item.days_of_week.split(',').map(d => d.trim()).includes(targetDay);
                }
                return false;
            });
            
            return filtered.map(item => {
                const course = this.courses.find(c => String(c.id) === String(item.course_id));
                return {
                    ...item,
                    color: course?.color || '#3B82F6'
                };
            }).sort((a, b) => {
                if (!a.start_time) return 1;
                if (!b.start_time) return -1;
                return a.start_time.localeCompare(b.start_time);
            });

            const dayMap = { 0: 'Mon', 1: 'Tue', 2: 'Wed', 3: 'Thu', 4: 'Fri', 5: 'Sat', 6: 'Sun' };

            const officeHoursList = [];
            this.courses.forEach(course => {
                course.officeHours?.forEach(oh => {

                            end_time: oh.end_time,
                            location: oh.location || '',

                });
            });
            
            return officeHoursList.sort((a, b) => {

        getCurrentWeekStart() {
            if (this.selectedWeek !== null && this.term.start_date) {
                const termStart = new Date(this.term.start_date);
                const weekStart = new Date(termStart);
                weekStart.setDate(termStart.getDate() + (this.selectedWeek - 1) * 7);
                const dayOfWeek = weekStart.getDay();
                const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                weekStart.setDate(weekStart.getDate() + daysToMonday);
                return weekStart;
            }
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
            return weekStart;
        },
        
        getAllDayEventsByDay(dayIndex) {
            const weekStart = this.getCurrentWeekStart();
            const targetDate = new Date(weekStart);
            targetDate.setDate(weekStart.getDate() + dayIndex);
            
            return this.filteredComprehensiveEvents.filter(event => {
                if (!event.all_day) return false;
                let eventDate;
                if (typeof event.start_datetime === 'string' && event.start_datetime.includes('T') && !event.start_datetime.includes('Z')) {
                    const datePart = event.start_datetime.split('T')[0];
                    const [year, month, day] = datePart.split('-').map(Number);
                    eventDate = new Date(year, month - 1, day);
                } else {
                    eventDate = new Date(event.start_datetime);
                }
                return eventDate.toDateString() === targetDate.toDateString();
            });
        },
        
        getEventsByDayAndHour(dayIndex, hour) {
            const weekStart = this.getCurrentWeekStart();
            const targetDate = new Date(weekStart);
            targetDate.setDate(weekStart.getDate() + dayIndex);
            targetDate.setHours(hour, 0, 0, 0);
            
            return this.filteredComprehensiveEvents.filter(event => {
                if (event.all_day) return false;
                let eventDate;
                if (typeof event.start_datetime === 'string' && event.start_datetime.includes('T') && !event.start_datetime.includes('Z')) {
                    const datePart = event.start_datetime.split('T')[0];
                    const timePart = event.start_datetime.split('T')[1];
                    const [year, month, day] = datePart.split('-').map(Number);
                    const [hours, minutes] = timePart.split(':').map(Number);
                    eventDate = new Date(year, month - 1, day, hours || 0, minutes || 0);
                } else {
                    eventDate = new Date(event.start_datetime);
                }
                const eventHour = eventDate.getHours();
                return eventDate.toDateString() === targetDate.toDateString() && 
                       eventHour >= hour && eventHour < hour + 2;
            });
        },
        
        getEventsForMonth(day) {
            const targetDate = new Date(this.selectedYear, this.selectedMonth - 1, day);
            return this.filteredComprehensiveEvents.filter(event => {
                let eventDate;
                if (typeof event.start_datetime === 'string' && event.start_datetime.includes('T') && !event.start_datetime.includes('Z')) {
                    const datePart = event.start_datetime.split('T')[0];
                    const [year, month, day] = datePart.split('-').map(Number);
                    eventDate = new Date(year, month - 1, day);
                } else {
                    eventDate = new Date(event.start_datetime);
                }
                return eventDate.getFullYear() === targetDate.getFullYear() &&
                       eventDate.getMonth() === targetDate.getMonth() &&
                       eventDate.getDate() === targetDate.getDate();
            });
        },
        
        getDaysInMonth() {

        getFirstDayOfMonth() {

        prevWeek() {
            if (this.selectedWeek !== null && this.selectedWeek > 1) {
                this.selectedWeek--;
            } else {
                const weekStart = this.getCurrentWeekStart();
                weekStart.setDate(weekStart.getDate() - 7);
                this.selectedWeek = this.getWeekNumber(weekStart);
            }
        },
        
        nextWeek() {
            if (this.selectedWeek !== null) {
                this.selectedWeek++;
            } else {
                const weekStart = this.getCurrentWeekStart();
                weekStart.setDate(weekStart.getDate() + 7);
                this.selectedWeek = this.getWeekNumber(weekStart);
            }
        },
        
        prevMonth() {
            if (this.selectedMonth === 1) {
                this.selectedMonth = 12;
                this.selectedYear--;
            } else {
                this.selectedMonth--;
            }
        },
        
        nextMonth() {
            if (this.selectedMonth === 12) {
                this.selectedMonth = 1;
                this.selectedYear++;
            } else {
                this.selectedMonth++;
            }
        },
        
        getAvailableWeeks() {
            if (!this.term.start_date || !this.term.end_date) return [];
            const weeks = [];
            const termStart = new Date(this.term.start_date);
            const termEnd = new Date(this.term.end_date);
            const currentDate = new Date(termStart);
            let weekNum = 1;
            
            while (currentDate <= termEnd) {
                weeks.push(weekNum);
                currentDate.setDate(currentDate.getDate() + 7);
                weekNum++;
            }
            return weeks;

        // Personal activity methods
        quickAddActivity() {
            if (!this.quickAddText.trim()) return;
            
            const text = this.quickAddText.trim();
            const now = new Date();
            const currentYear = this.term.start_date ? new Date(this.term.start_date).getFullYear() : now.getFullYear();
            
            const datePatterns = [
                /(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+(\d{1,2})(?:,\s*(\d{4}))?/i,
                /(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/,
                /(\d{1,2})-(\d{1,2})(?:-(\d{4}))?/
            ];
            
            const timePatterns = [
                /(\d{1,2}):(\d{2})\s*(AM|PM)?/i,
                /(\d{1,2})\s*(AM|PM)/i
            ];
            
            const durationMatch = text.match(/(\d+(?:\.\d+)?)\s*(h|hr|hour|hours|min|minute|minutes)/i);
            let duration = 60;
            if (durationMatch) {
                const value = parseFloat(durationMatch[1]);
                const unit = durationMatch[2].toLowerCase();
                duration = unit.startsWith('h') ? value * 60 : value;
            }
            
            let category = 'STUDY';
            const lowerText = text.toLowerCase();
            if (lowerText.includes('gym') || lowerText.includes('workout') || lowerText.includes('exercise') || lowerText.includes('fitness')) {
                category = 'HEALTH';
            } else if (lowerText.includes('work') || lowerText.includes('shift') || lowerText.includes('job')) {
                category = 'WORK';
            } else if (lowerText.includes('interview') || lowerText.includes('career') || lowerText.includes('networking')) {
                category = 'INTERVIEW';
            } else if (lowerText.includes('party') || lowerText.includes('social') || lowerText.includes('trip') || lowerText.includes('travel') || lowerText.includes('dmv') || lowerText.includes('shopping')) {
                category = 'SOCIAL';
            } else if (lowerText.includes('bill') || lowerText.includes('due') || lowerText.includes('deadline') || lowerText.includes('payment')) {
                category = 'DEADLINE';
            } else if (lowerText.includes('study') || lowerText.includes('exam') || lowerText.includes('review')) {
                category = 'STUDY';
            }
            
            let foundDate = null;
            for (const pattern of datePatterns) {
                const match = text.match(pattern);
                if (match) {
                    if (pattern === /(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+(\d{1,2})(?:,\s*(\d{4}))?/i) {
                        const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                        const monthName = match[0].split(/\s+/)[0].toLowerCase().replace('.', '');
                        const month = monthNames.indexOf(monthName);
                        const day = parseInt(match[1]);
                        const year = match[2] ? parseInt(match[2]) : currentYear;
                        if (month >= 0) foundDate = new Date(year, month, day);
                    } else {
                        const month = parseInt(match[1]) - 1;
                        const day = parseInt(match[2]);
                        const year = match[3] ? parseInt(match[3]) : currentYear;
                        foundDate = new Date(year, month, day);
                    }
                    if (foundDate) break;
                }
            }
            
            if (!foundDate) {
                const dayMap = { 'mon': 1, 'tue': 2, 'wed': 3, 'thu': 4, 'fri': 5, 'sat': 6, 'sun': 0 };
                const dayMatch = text.match(/(mon|tue|wed|thu|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
                if (dayMatch) {
                    const dayName = dayMatch[0].substring(0, 3).toLowerCase();
                    const targetDay = dayMap[dayName];
                    const today = now.getDay();
                    let daysToAdd = (targetDay - today + 7) % 7;
                    if (daysToAdd === 0) daysToAdd = 7;
                    foundDate = new Date(now);
                    foundDate.setDate(now.getDate() + daysToAdd);
                }
            }
            
            if (!foundDate) {
                foundDate = new Date(now);
            }
            
            let hours = null, minutes = 0;
            let timeFound = false;
            for (const pattern of timePatterns) {
                const match = text.match(pattern);
                if (match) {
                    hours = parseInt(match[1]);
                    minutes = match[2] ? parseInt(match[2]) : 0;
                    if (match[3] || match[2]) {
                        const ampm = (match[3] || match[2]).toUpperCase();
                        if (ampm === 'PM' && hours !== 12) hours += 12;
                        if (ampm === 'AM' && hours === 12) hours = 0;
                        timeFound = true;
                    } else {
                        if (hours > 12) {
                            timeFound = true;
                        } else if (hours >= 7 && hours < 12) {
                            hours += 12;
                            timeFound = true;
                        }
                    }
                    if (timeFound) break;
                }
            }
            
            if (hours === null) {
                hours = 12;
                minutes = 0;
                if (category === 'WORK') {
                    hours = 9;
                } else if (category === 'HEALTH') {
                    hours = 18;
                } else if (category === 'STUDY') {
                    hours = 19;
                }
            }
            
            const hasTimeInText = text.match(/\d{1,2}[:]\d{2}|\d{1,2}\s*(AM|PM)/i);
            if (!hasTimeInText) {
                const timeWasParsed = text.match(/\d{1,2}[:]\d{2}/);
                if (!timeWasParsed) {
                    if (category === 'WORK') {
                        hours = 9;
                        minutes = 0;
                    } else if (category === 'HEALTH') {
                        hours = 18;
                        minutes = 0;
                    } else if (category === 'STUDY') {
                        hours = 19;
                        minutes = 0;
                    }
                }
            }
            
            const dateStr = `${foundDate.getFullYear()}-${String(foundDate.getMonth() + 1).padStart(2, '0')}-${String(foundDate.getDate()).padStart(2, '0')}`;
            const startDatetime = buildLocalDateTime(dateStr, { hh: String(hours).padStart(2, '0'), mm: String(minutes).padStart(2, '0') });
            
            // Calculate end time
            const startMinutes = hours * 60 + minutes;
            const endMinutes = startMinutes + duration;
            const endHours = Math.floor(endMinutes / 60);
            const endMins = endMinutes % 60;
            const endDate = new Date(foundDate);
            endDate.setHours(endHours, endMins, 0, 0);
            const endDateStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;
            const endDatetime = buildLocalDateTime(endDateStr, { hh: String(endHours % 24).padStart(2, '0'), mm: String(endMins).padStart(2, '0') });
            
            let title = text
                .replace(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{1,2}(?:,\s*\d{4})?/gi, '')
                .replace(/\d{1,2}\/\d{1,2}(?:\/\d{4})?/g, '')
                .replace(/\d{1,2}-\d{1,2}(?:-\d{4})?/g, '')
                .replace(/(?:mon|tue|wed|thu|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i, '')
                .replace(/\d{1,2}:\d{2}\s*(AM|PM)?/gi, '')
                .replace(/\d{1,2}\s*(AM|PM)/gi, '')
                .replace(/\d+(?:\.\d+)?\s*(h|hr|hour|hours|min|minute|minutes)/gi, '')
                .trim();
            
            if (title.length === 0) {
                title = category;
            }
            
            let reminder = '30min';
            if (category === 'WORK' || category === 'INTERVIEW') {
                reminder = '1day,30min';
            } else if (category === 'STUDY' || category === 'HEALTH') {
                reminder = '15min';
            } else if (category === 'DEADLINE') {
                reminder = '3days';
            }
            
            const activity = {
                id: `personal-${Date.now()}-${Math.random()}`,
                title: title,
                category: category,
                start_datetime: startDatetime,
                end_datetime: endDatetime,
                all_day: false,
                location: '',
                recurring: '',
                reminder: reminder,
                source: 'personal',
                color: this.getPersonalCategoryColor(category)
            };
            
            this.events.push(activity);
            Storage.set('events', this.events);
            this.quickAddText = '';
            const msg = this.i18n ? this.i18n.t('message.added') + ' ' + title : 'Added ' + title;
            alert(msg);
        },
        
        applyTemplate(template) {
            if (!this.term.start_date || !this.term.end_date) {
                const msg = this.i18n ? this.i18n.t('message.pleaseSetTerm') : 'Please set term dates';
                alert(msg);
                return;
            }
            
            const startDate = new Date(this.term.start_date);
            const endDate = new Date(this.term.end_date);
            const dayMap = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6, 'Sun': 0 };
            const days = template.days.split(',').map(d => d.trim());
            const [startHour, startMin] = template.time.split(':').map(Number);
            const duration = template.duration || 60;
            
            let currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                const dayOfWeek = currentDate.getDay();
                const dayName = Object.keys(dayMap).find(k => dayMap[k] === dayOfWeek);
                
                if (dayName && days.includes(dayName)) {
                    const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
                    const startDatetime = buildLocalDateTime(dateStr, { hh: String(startHour).padStart(2, '0'), mm: String(startMin).padStart(2, '0') });
                    
                    // Calculate end time
                    const startMinutes = startHour * 60 + startMin;
                    const endMinutes = startMinutes + duration;
                    const endHours = Math.floor(endMinutes / 60);
                    const endMins = endMinutes % 60;
                    const endDateObj = new Date(currentDate);
                    endDateObj.setHours(endHours, endMins, 0, 0);
                    const endDateStr = `${endDateObj.getFullYear()}-${String(endDateObj.getMonth() + 1).padStart(2, '0')}-${String(endDateObj.getDate()).padStart(2, '0')}`;
                    const endDatetime = buildLocalDateTime(endDateStr, { hh: String(endHours % 24).padStart(2, '0'), mm: String(endMins).padStart(2, '0') });
                    
                    const activity = {
                        id: `personal-${Date.now()}-${Math.random()}`,
                        title: template.name,
                        category: template.category,
                        start_datetime: startDatetime,
                        end_datetime: endDatetime,
                        all_day: false,
                        location: '',
                        recurring: template.days,
                        reminder: template.category === 'HEALTH' || template.category === 'STUDY' ? '15min' : '30min',
                        source: 'personal',
                        color: this.getPersonalCategoryColor(template.category)
                    };
                    
                    this.events.push(activity);
                }
                
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            Storage.set('events', this.events);
            const msg = this.i18n ? this.i18n.t('message.addedTemplate').replace('{name}', template.name) : `Added template: ${template.name}`;
            alert(msg);
        },
        
        editPersonalActivity(activity) {
            if (!activity) return;
            let startDate, endDate;
            
            // Handle floating local datetime
            if (typeof activity.start_datetime === 'string' && activity.start_datetime.includes('T') && !activity.start_datetime.includes('Z')) {
                const datePart = activity.start_datetime.split('T')[0];
                const [year, month, day] = datePart.split('-').map(Number);
                startDate = new Date(year, month - 1, day);
            } else {
                startDate = new Date(activity.start_datetime);
            }
            
            if (activity.end_datetime) {
                if (typeof activity.end_datetime === 'string' && activity.end_datetime.includes('T') && !activity.end_datetime.includes('Z')) {
                    const datePart = activity.end_datetime.split('T')[0];
                    const [year, month, day] = datePart.split('-').map(Number);
                    endDate = new Date(year, month - 1, day);
                } else {
                    endDate = new Date(activity.end_datetime);
                }
            }
            
            const startDateStr = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}-${String(startDate.getDate()).padStart(2, '0')}`;
            const startTimeStr = !activity.all_day && activity.start_datetime && activity.start_datetime.includes('T') 
                ? activity.start_datetime.split('T')[1]?.substring(0, 5) 
                : '';
            
            let endDateStr = '';
            let endTimeStr = '';
            if (endDate) {
                endDateStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;
                endTimeStr = !activity.all_day && activity.end_datetime && activity.end_datetime.includes('T')
                    ? activity.end_datetime.split('T')[1]?.substring(0, 5)
                    : '';
            }
            
            this.newPersonalActivity = {
                title: activity.title || '',
                category: activity.category || 'STUDY',
                start_datetime: startDateStr,
                start_time: startTimeStr,
                end_datetime: endDateStr,
                end_time: endTimeStr,
                all_day: activity.all_day || false,
                location: activity.location || '',
                recurring: activity.recurring || '',
                reminder: activity.reminder || '30min',
                color: activity.color || this.getPersonalCategoryColor(activity.category || 'STUDY')
            };
            this.editingPersonalActivityId = activity.id;
            this.showPersonalActivityForm = true;
        },
        
        deletePersonalActivity(activityId) {
            const msg = this.i18n ? this.i18n.t('message.confirmDeleteActivity') : 'Are you sure?';
            if (confirm(msg)) {
                this.events = this.events.filter(e => e.id !== activityId);
                Storage.set('events', this.events);
            }
        },
        
        savePersonalActivity() {
            if (!this.newPersonalActivity.title || !this.newPersonalActivity.start_datetime) {
                const msg = this.i18n ? this.i18n.t('message.pleaseFillTitleDate') : 'Please fill title and date';
                alert(msg);
                return;
            }
            
            let startDatetime, endDatetime;
            
            if (this.newPersonalActivity.all_day) {
                startDatetime = buildLocalDateTime(this.newPersonalActivity.start_datetime, null);
                
                if (this.newPersonalActivity.end_datetime) {
                    endDatetime = buildLocalDateTime(this.newPersonalActivity.end_datetime, { hh: '23', mm: '59' });
                } else {
                    endDatetime = buildLocalDateTime(this.newPersonalActivity.start_datetime, { hh: '23', mm: '59' });
                }
            } else {
                const startDateStr = this.newPersonalActivity.start_datetime;
                const startTimeStr = this.newPersonalActivity.start_time || '12:00';
                const [startHour, startMin] = startTimeStr.split(':').map(Number);
                
                startDatetime = buildLocalDateTime(startDateStr, { hh: String(startHour || 12).padStart(2, '0'), mm: String(startMin || 0).padStart(2, '0') });
                
                if (this.newPersonalActivity.end_datetime && this.newPersonalActivity.end_time) {
                    const [endHour, endMin] = this.newPersonalActivity.end_time.split(':').map(Number);
                    endDatetime = buildLocalDateTime(this.newPersonalActivity.end_datetime, { hh: String(endHour).padStart(2, '0'), mm: String(endMin).padStart(2, '0') });
                } else if (this.newPersonalActivity.end_datetime) {
                    const endDate = new Date(startDateStr + 'T' + startTimeStr);
                    endDate.setHours(endDate.getHours() + 1);
                    endDatetime = buildLocalDateTime(this.newPersonalActivity.end_datetime, { hh: String(endDate.getHours()).padStart(2, '0'), mm: String(endDate.getMinutes()).padStart(2, '0') });
                } else {
                    const endDate = new Date(startDateStr + 'T' + startTimeStr);
                    endDate.setHours(endDate.getHours() + 1);
                    endDatetime = buildLocalDateTime(startDateStr, { hh: String(endDate.getHours()).padStart(2, '0'), mm: String(endDate.getMinutes()).padStart(2, '0') });
                }
            }
            
            const category = this.newPersonalActivity.category || 'STUDY';
            const activity = {
                id: this.editingPersonalActivityId || `personal-${Date.now()}-${Math.random()}`,
                title: this.newPersonalActivity.title,
                category: category,
                type: category,
                start_datetime: startDatetime,
                end_datetime: endDatetime,
                all_day: this.newPersonalActivity.all_day || false,
                location: this.newPersonalActivity.location || '',
                recurring: this.newPersonalActivity.recurring || '',
                reminder: this.newPersonalActivity.reminder || '30min',
                source: 'personal',
                color: this.newPersonalActivity.color || this.getPersonalCategoryColor(category)
            };
            
            if (this.editingPersonalActivityId) {
                const index = this.events.findIndex(e => e.id === this.editingPersonalActivityId);
                if (index !== -1) {
                    this.events[index] = activity;
                }
            } else {
                this.events.push(activity);
            }
            
            Storage.set('events', this.events);
            this.showPersonalActivityForm = false;
            this.editingPersonalActivityId = null;
            this.newPersonalActivity = { title: '', category: 'STUDY', start_datetime: '', end_datetime: '', all_day: false, location: '', recurring: '', reminder: '30min', color: '' };
        }
    };
}

// Export app function for Alpine.data registration
// This is the function that Alpine will call when x-data="app" is used
const app = createApp;


            
            // ========== 初始化代码 ==========
            // 初始化存储
            if (typeof initData === 'function') {
                initData();
                console.log('✅ Storage initialized');
            }
            
            // 注册Alpine组件
            // 注意：createApp函数和app变量已经在alpineApp.js中定义
            // alpineApp.js最后有: const app = createApp;
            function initializeAlpine() {
                if (typeof Alpine === 'undefined') {
                    console.warn('Alpine.js not loaded yet, retrying...');
                    setTimeout(initializeAlpine, 100);
                    return;
                }
                
                // 使用alpineApp.js中定义的app函数（const app = createApp;）
                if (typeof app === 'function') {
                    Alpine.data('app', app);
                    console.log('✅ App component registered with Alpine');
                } else if (typeof createApp === 'function') {
                    // 备用：如果app不存在，使用createApp
                    Alpine.data('app', createApp);
                    console.log('✅ App component registered with Alpine (using createApp)');
                } else {
                    console.error('❌ app or createApp function not found');
                    console.error('Available:', {
                        hasApp: typeof app !== 'undefined',
                        hasCreateApp: typeof createApp !== 'undefined',
                        hasStateStore: typeof StateStore !== 'undefined'
                    });
                }
                
                // 隐藏加载屏幕
                const loading = document.getElementById('loading');
                const appEl = document.getElementById('app');
                if (loading) {
                    loading.style.display = 'none';
                    console.log('✅ Loading screen hidden');
                }
                if (appEl) {
                    appEl.removeAttribute('x-cloak');
                    appEl.style.display = 'block';
                    console.log('✅ App element shown');
                }
            }
            
            // 等待Alpine加载
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(initializeAlpine, 100);
                });
            } else {
                setTimeout(initializeAlpine, 100);
            }
            
            // 也监听alpine:init事件
            document.addEventListener('alpine:init', () => {
                initializeAlpine();
            });
        })();
    </script>
